name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare pinned Windows rz/sz interoperability peer
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'lrzsz-peer.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'lrzsz-peer'
          Invoke-WebRequest 'https://github.com/trzsz/lrzsz-win32/releases/download/v0.12.21rc/lrzsz_0.12.21rc_windows_x86_64.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'DACE2DB172B1B5A1E5998692760A75355B254E1826718D88BAE7FA3A6DE3C325') {
            throw 'lrzsz fixture checksum mismatch'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          (Join-Path $destination 'lrzsz_0.12.21rc_windows_x86_64') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'OSHELL_REQUIRE_LRZSZ=1' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Core, PTY and ZMODEM race checks
        run: go test -race ./internal/core ./internal/terminal/internal/pty ./internal/zmodem
      - name: Full regression suite
        run: go test -count=1 -timeout=180s ./...
      - name: Patched listing parsers
        run: go test github.com/jlaffaye/ftp github.com/pkg/sftp -run 'Test(UNIXMetadata|OwnerHints|Parse)'
      - name: Signing policy tests
        run: python scripts/test-code-signing.py
      - name: Portable publication tests
        run: python scripts/test-build.py
      - name: Compile native UI
        env:
          CGO_ENABLED: '0'
        run: go build ./...
      - name: Vet
        run: go vet ./...
  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: windows/amd64
            artifact: windows-amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package native application
        env:
          CGO_ENABLED: '0'
        run: python scripts/build.py --target ${{ matrix.target }} --archive
      - uses: actions/upload-artifact@v4
        with:
          name: oshell-${{ matrix.artifact }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7
