name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Core and PTY race checks
        run: go test -race ./internal/core ./internal/terminal/internal/pty
      - name: Full regression suite
        run: go test -count=1 -timeout=180s ./...
      - name: Patched listing parsers
        run: go test github.com/jlaffaye/ftp github.com/pkg/sftp -run 'Test(UNIXMetadata|OwnerHints|Parse)'
      - name: Signing policy tests
        run: python scripts/test-code-signing.py
      - name: Portable publication tests
        run: python scripts/test-build.py
      - name: Compile native UI
        env:
          CGO_ENABLED: '0'
        run: go build ./...
      - name: Vet
        run: go vet ./...
  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: windows/amd64
            artifact: windows-amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package native application
        env:
          CGO_ENABLED: '0'
        run: python scripts/build.py --target ${{ matrix.target }} --archive
      - uses: actions/upload-artifact@v4
        with:
          name: oshell-${{ matrix.artifact }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7
