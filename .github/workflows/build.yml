name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare pinned Windows rz/sz interoperability peer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'lrzsz-peer.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'lrzsz-peer'
          Invoke-WebRequest 'https://github.com/trzsz/lrzsz-win32/releases/download/v0.12.21rc/lrzsz_0.12.21rc_windows_x86_64.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'DACE2DB172B1B5A1E5998692760A75355B254E1826718D88BAE7FA3A6DE3C325') {
            throw 'lrzsz fixture checksum mismatch'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          (Join-Path $destination 'lrzsz_0.12.21rc_windows_x86_64') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'OSHELL_REQUIRE_LRZSZ=1' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Prepare Linux runtime and rz/sz interoperability peer
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-0 xvfb xauth dbus-x11 libgl1-mesa-dri libglx-mesa0 libegl-mesa0 fonts-dejavu-core fonts-noto-cjk lrzsz
          echo 'OSHELL_REQUIRE_LRZSZ=1' >> "$GITHUB_ENV"
      - name: Core, PTY and ZMODEM race checks
        # Production-strength key derivation exceeds Go's default 10m timeout under -race.
        timeout-minutes: 35
        run: go test -race -count=1 -timeout=30m ./internal/core ./internal/terminal/internal/pty ./internal/zmodem
      - name: Full regression suite
        if: runner.os == 'Windows'
        run: go test -count=1 -timeout=180s ./...
      - name: Full Linux regression suite
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- go test -count=1 -timeout=180s ./...
      - name: Patched listing parsers
        run: go test github.com/jlaffaye/ftp github.com/pkg/sftp -run 'Test(UNIXMetadata|OwnerHints|Parse)'
      - name: Portable publication tests
        run: python scripts/test-build.py
      - name: Configuration contract tooling
        run: python scripts/test-configuration-contract.py
      - name: Compile native UI
        env:
          CGO_ENABLED: '0'
        run: go build ./...
      - name: Vet
        run: go vet ./...
  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: windows/amd64
            artifact: windows-amd64
            options: --single-file
          - runner: ubuntu-24.04
            target: linux/amd64
            artifact: linux-amd64
            options: ''
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package native application
        env:
          CGO_ENABLED: '0'
        run: python scripts/build.py --target ${{ matrix.target }} ${{ matrix.options }} --archive
      - uses: actions/upload-artifact@v4
        with:
          name: oshell-${{ matrix.artifact }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          version = json.loads(Path('mygo.json').read_text(encoding='utf-8'))['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Release tag must match the built application version'
          PY
      - uses: actions/download-artifact@v4
        with:
          pattern: oshell-*
          path: release-assets
          merge-multiple: true
      - name: Publish Windows and Linux release packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release-assets
          sha256sum OShell-Desktop-windows-amd64-single-file.zip OShell-Desktop-linux-amd64.tar.gz > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --latest \
            OShell-Desktop-windows-amd64-single-file.zip OShell-Desktop-linux-amd64.tar.gz SHA256SUMS.txt
