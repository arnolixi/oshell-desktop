name: Self-hosted container build trial
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: self-hosted-build-trial
  cancel-in-progress: false
jobs:
  windows-tools:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
    steps:
      - name: Verify selected Windows machine
        run: |
          if ($env:RUNNER_NAME -ne 'LAPTOP-NGQ35G2T') { throw 'Unexpected Windows runner' }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: runner-bootstrap
          sparse-checkout: scripts
      - name: Prepare persistent verified tool caches alongside Linux compilation
        run: ./runner-bootstrap/scripts/prepare-runner-tools.ps1
      - uses: actions/setup-python@v5
        env:
          PSExecutionPolicyPreference: Bypass
        with:
          python-version: '3.12.10'
          check-latest: false
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    outputs:
      windows-artifact-id: ${{ steps.windows-bundle.outputs.artifact-id }}
      windows-artifact-digest: ${{ steps.windows-bundle.outputs.artifact-digest }}
    steps:
      - name: Verify selected Linux machine and Docker
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = develop
          printf 'Runner: %s\nCPU threads: %s\n' "$RUNNER_NAME" "$(nproc)" | tee -a "$GITHUB_STEP_SUMMARY"
          free -h
          docker version
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: First container build of both platforms and Windows test binaries
        shell: bash
        run: |
          set -euo pipefail
          # Persist only this repository's compiler caches, outside checkout and job temp.
          export OSHELL_CI_CACHE_DIR="$RUNNER_TOOL_CACHE/oshell-desktop-trial-cache"
          started=$SECONDS
          bash scripts/build-on-runner.sh package
          printf 'First package build (including image preparation): %ss\n' "$((SECONDS-started))" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Repeat the same container build with warm caches
        shell: bash
        run: |
          set -euo pipefail
          export OSHELL_CI_CACHE_DIR="$RUNNER_TOOL_CACHE/oshell-desktop-trial-cache"
          export OSHELL_CI_IMAGE_READY=1
          started=$SECONDS
          bash scripts/build-on-runner.sh package
          printf 'Warm package build: %ss\n' "$((SECONDS-started))" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Combine Windows tests and portable package into one transfer
        shell: bash
        run: |
          mkdir -p validation/container-package
          cp dist/OShell-Desktop-windows-amd64-single-file.zip validation/container-package/
      - uses: actions/upload-artifact@v4
        id: windows-bundle
        with:
          name: windows-validation
          path: |
            validation/windows-tests/*
            validation/container-package/OShell-Desktop-windows-amd64-single-file.zip
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: oshell-windows-amd64
          compression-level: 0
          path: dist/OShell-Desktop-windows-amd64-single-file.zip
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: oshell-linux-amd64
          compression-level: 0
          path: dist/OShell-Desktop-linux-amd64.tar.gz
          if-no-files-found: error
          retention-days: 7
  linux:
    needs: package
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 25
    steps:
      - name: Verify selected Linux machine
        shell: bash
        run: test "$RUNNER_NAME" = develop
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Linux regression and PTY ZMODEM race tests in Docker
        shell: bash
        env:
          OSHELL_CI_IMAGE_READY: '1'
        run: |
          set -euo pipefail
          export OSHELL_CI_CACHE_DIR="$RUNNER_TOOL_CACHE/oshell-desktop-trial-cache"
          started=$SECONDS
          bash scripts/build-on-runner.sh linux
          printf 'Linux regression: %ss\n' "$((SECONDS-started))" | tee -a "$GITHUB_STEP_SUMMARY"
  windows:
    needs: [package, windows-tools]
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: pwsh -NoProfile -ExecutionPolicy Bypass -File {0}
    steps:
      - name: Verify selected Windows machine
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'LAPTOP-NGQ35G2T') { throw 'Unexpected Windows runner' }
          "Runner: $env:RUNNER_NAME; CPU threads: $env:NUMBER_OF_PROCESSORS" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Activate verified cached PowerShell and rz sz tools
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: ./scripts/prepare-runner-tools.ps1
      - uses: actions/setup-python@v5
        env:
          # setup-python launches Windows PowerShell itself; scope the policy to its children.
          PSExecutionPolicyPreference: Bypass
        with:
          python-version: '3.12.10'
          check-latest: false
      - name: Test cache recovery and artifact verification
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/test-runner-tools.ps1
          python scripts/test-runner-artifact.py
          exit $LASTEXITCODE
      - name: Download combined Windows inputs with bounded retries and SHA256 verification
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.package.outputs.windows-artifact-id }}
          ARTIFACT_DIGEST: ${{ needs.package.outputs.windows-artifact-digest }}
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/download_runner_artifact.py --id $env:ARTIFACT_ID --digest $env:ARTIFACT_DIGEST
          exit $LASTEXITCODE
      - name: Execute precompiled regression suite and PTY ZMODEM race tests
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/ci-test-bundle.py windows
          exit $LASTEXITCODE
      - name: Verify single-file GUI and update preservation without compiling
        run: |
          $ErrorActionPreference = 'Stop'
          $destination = "validation/container-package/extracted-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          Expand-Archive -LiteralPath 'validation/container-package/OShell-Desktop-windows-amd64-single-file.zip' -DestinationPath $destination -Force
          $files = @(Get-ChildItem -LiteralPath $destination -File -Recurse)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'OShell Desktop.exe') { throw 'Expected exactly one portable EXE' }
          ./scripts/test-update-package.ps1 -Executable $files[0].FullName -FixtureExecutable validation/windows-tests/update-fixture.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-update-smoke
          path: validation/update-package-smoke.json
          if-no-files-found: warn
          retention-days: 7
